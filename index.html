<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор (50 потоков, цикл)</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        #status { color: gray; margin-bottom: 10px; }
        #info { font-size: 13px; color: gray; margin-bottom: 15px; }
        #result { font-size: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 400px; margin: 0 auto; }
        .num-badge { padding: 6px 10px; border-radius: 8px; background: rgba(128, 128, 128, 0.2); font-weight: bold; }
    </style>
</head>
<body>
    <h2 id="title">Раунд #1: Генерация...</h2>
    <p id="status">Загрузка CPU (0/50 завершено)...</p>
    <p id="info">Активных воркеров в памяти: 0</p>
    <div id="result"></div>

    <script>
        Telegram.WebApp.ready();

        const WORKERS_COUNT = 200;
        const DURATION_MS = 10000; // 60 секунд

        // Код воркера с усиленной рандомизацией
        const workerCode = `
            self.onmessage = function(e) {
                const { id, duration, randomSalt } = e.data;
                // Смешиваем ID потока, случайную соль и высокоточный таймер
                let x = Math.floor((id + 1) * randomSalt * 1000000) ^ Math.floor(performance.now() * 1000);
                const start = Date.now();
                
                while (Date.now() - start < duration) {
                    // Xorshift + LCG для более хаотичного распределения
                    x ^= x << 13;
                    x ^= x >>> 17;
                    x ^= x << 5;
                    x = (x * 1103515245 + 12345 + (id * 7919)) & 0x7fffffff;
                }
                
                // Дополнительная рандомизация на выходе
                const finalEntropy = (x ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
                self.postMessage({ id, entropy: finalEntropy });
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        // Общее хранилище всех созданных воркеров за все раунды (без закрытия)
        const allSavedWorkers = [];
        let round = 0;

        function startRound() {
            round++;
            let completed = 0;
            const roundResults = new Array(WORKERS_COUNT);
            const currentRoundWorkers = [];

            document.getElementById('title').innerText = 'Раунд #' + round + ': Генерация (60 сек)...';
            document.getElementById('status').innerText = 'Загрузка CPU (0/' + WORKERS_COUNT + ' завершено)...';

            for (let i = 0; i < WORKERS_COUNT; i++) {
                const worker = new Worker(workerUrl);
                
                // Сохраняем как в массив текущего раунда, так и в глобальный список
                currentRoundWorkers.push(worker);
                allSavedWorkers.push(worker);

                document.getElementById('info').innerText = 'Активных воркеров в памяти: ' + allSavedWorkers.length;

                worker.onmessage = function(e) {
                    completed++;
                    roundResults[e.data.id] = e.data.entropy;
                    document.getElementById('status').innerText = 'Загрузка CPU (' + completed + '/' + WORKERS_COUNT + ' завершено)...';

                    // Когда все 50 потоков закончили 60-секундный цикл
                    if (completed === WORKERS_COUNT) {
                        renderUniqueNumbers(roundResults);
                        // Перезапускаем процесс через 2 секунды с новыми воркерами
                        setTimeout(startRound, 2000);
                    }
                };

                worker.postMessage({
                    id: i,
                    duration: DURATION_MS,
                    randomSalt: Math.random() + Math.random()
                });
            }
        }

        // Формируем 50 неповторяющихся чисел от 1 до 50 на основе результатов воркеров
        function renderUniqueNumbers(entropies) {
            const pool = Array.from({ length: 50 }, (_, idx) => idx + 1);

            // Перемешивание Фишера — Йетса с использованием энтропии от каждого воркера
            for (let i = pool.length - 1; i > 0; i--) {
                const randVal = (entropies[i] ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
                const j = randVal % (i + 1);
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            pool.forEach(num => {
                const badge = document.createElement('div');
                badge.className = 'num-badge';
                badge.innerText = num;
                resultDiv.appendChild(badge);
            });

            document.getElementById('title').innerText = 'Раунд #' + round + ' завершён!';
            document.getElementById('status').innerText = 'Перезапуск через 2 сек...';
        }

        // Запуск первого раунда
        startRound();
    </script>
</body>
</html>
